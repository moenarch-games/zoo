[package]
name = "zoo-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Deterministic simulation core for the Zoo management game"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_path_to_error = "0.1.20"
wasm-bindgen = "0.2"

[features]
default = ["work-zones"]
# Marker for the keeper work-zone API (#135). The runtime-evidence workflow copies
# `examples/profile_simulation.rs` onto the base revision; gating the zone setup on
# this feature keeps that shared workload compiling against a base without zones.
work-zones = []
