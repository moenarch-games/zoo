[package]
name = "zoo-scene"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Zoo-specific scene and camera interaction policy over shared 3D foundations"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
three-d-camera = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "231d8fe1a4766753b3f6f2eb03c113b6a0cd206f" }
three-d-core = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "3854f81fec92b81d365f7dba0fdc96210fb03dcc" }
three-d-projective = { git = "https://github.com/moritzbrantner/3d-lab.git", rev = "231d8fe1a4766753b3f6f2eb03c113b6a0cd206f" }
wasm-bindgen = "0.2"
