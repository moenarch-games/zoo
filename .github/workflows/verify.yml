name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Checkout pinned asset-tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzbrantner/asset-tooling
          ref: a9184128839b9c411103e958703c2d1c03dfc9a8
          path: .consumer-tools/asset-tooling
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Generate and replay-verify Zoo asset
        run: |
          spec="apps/web/public/generated-assets/zoo-park-texture.asset.json"
          tool=".consumer-tools/asset-tooling/src/entry.js"
          bun "$tool" validate "$spec"
          bun "$tool" generate "$spec" --receipt .asset-tooling/zoo-park-texture.receipt.json
          bun "$tool" verify "$spec" --receipt .asset-tooling/zoo-park-texture.receipt.json
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Verify repository
        run: make verify
      - name: Browser visual dogfood
        if: github.event_name == 'pull_request'
        working-directory: apps/web
        run: |
          bun run preview -- --host 127.0.0.1 --port 4173 > /tmp/zoo-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              cat /tmp/zoo-preview.log
              exit 1
            fi
            sleep 1
          done
          bun scripts/capture-park-view-proof.mjs
      - name: Upload park view visual proof
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zoo-park-view-visual-proof
          path: |
            apps/web/test-results/park-view-desktop.png
            apps/web/test-results/park-view-phone.png
            apps/web/test-results/park-view-rejected-placement.png
            apps/web/test-results/session-recovery-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload playable web preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zoo-playable-preview
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7
