name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    outputs:
      allow-skipped: ${{ steps.merge-scope.outputs.allow-skipped }}
      validate-runtime-evidence: ${{ steps.merge-scope.outputs.validate-runtime-evidence }}
      validate-foundation-audit: ${{ steps.merge-scope.outputs.validate-foundation-audit }}
      validate-assets: ${{ steps.merge-scope.outputs.validate-assets }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Determine required PR validation scope
        id: merge-scope
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_BRANCH: ${{ github.base_ref }}
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, re, subprocess
          paths = subprocess.check_output(["git", "diff", "--no-renames", "--name-only", "-z", os.environ["BASE_SHA"], os.environ["HEAD_SHA"]]).decode().split("\0")
          filters = {'validate-runtime-evidence': {'paths': None, 'branches': ['main']}, 'validate-foundation-audit': {'paths': ['.github/workflows/foundation-audit.yml', '.repository-environment.toml', 'scripts/codex-environment.sh', '.coding-tooling.json', 'conventions.json', 'conventions.lock.json', '.conventions/**', 'renovate.json', 'AGENTS.md', '.editorconfig', 'apps/web/package.json', 'apps/web/bun.lock', 'apps/web/tsconfig.json', 'apps/web/.oxlintrc.json', 'apps/web/.oxfmtrc.json', 'Makefile'], 'branches': None}, 'validate-assets': {'paths': ['tools/build_assets.py', 'tools/tests/**', 'assets/3d/**', '.github/workflows/assets.yml', 'Makefile'], 'branches': None}}
          def matches(path, pattern):
              pattern = re.escape(pattern).replace(r"\*\*", ".*").replace(r"\*", "[^/]*").replace(r"\?", "[^/]")
              return re.fullmatch(pattern, path) is not None
          skipped = []
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              for name, scope in filters.items():
                  matches_paths = scope["paths"] is None or any(matches(path, pattern) for path in paths if path for pattern in scope["paths"])
                  matches_branch = scope["branches"] is None or any(matches(os.environ["BASE_BRANCH"], pattern) for pattern in scope["branches"])
                  required = matches_paths and matches_branch
                  print(f"{name}={str(required).lower()}", file=output)
                  if not required:
                      skipped.append(name)
              print("allow-skipped=" + json.dumps(skipped), file=output)
          PYTHON
      - name: Checkout pinned asset-tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzbrantner/asset-tooling
          ref: a9184128839b9c411103e958703c2d1c03dfc9a8
          path: .consumer-tools/asset-tooling
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.3
      - name: Generate and replay-verify Zoo asset
        run: |
          spec="apps/web/public/generated-assets/zoo-park-texture.asset.json"
          tool=".consumer-tools/asset-tooling/src/entry.js"
          bun "$tool" validate "$spec"
          bun "$tool" generate "$spec" --receipt .asset-tooling/zoo-park-texture.receipt.json
          bun "$tool" verify "$spec" --receipt .asset-tooling/zoo-park-texture.receipt.json
      - name: Install wasm-pack
        run: cargo install wasm-pack --locked
      - name: Verify repository
        run: make verify
      - name: Browser visual dogfood
        if: github.event_name == 'pull_request'
        working-directory: apps/web
        run: |
          bun run preview -- --host 127.0.0.1 --port 4173 > /tmp/zoo-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              cat /tmp/zoo-preview.log
              exit 1
            fi
            sleep 1
          done
          bun scripts/capture-park-view-proof.mjs
      - name: Upload park view visual proof
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zoo-park-view-visual-proof
          path: |
            apps/web/test-results/park-view-desktop.png
            apps/web/test-results/park-view-phone.png
            apps/web/test-results/park-view-rejected-placement.png
            apps/web/test-results/session-recovery-*.png
          if-no-files-found: error
          retention-days: 7
      - name: Upload playable web preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zoo-playable-preview
          path: apps/web/dist
          if-no-files-found: error
          retention-days: 7

  validate-runtime-evidence:
    needs: verify
    if: github.event_name == 'pull_request' && needs.verify.outputs.validate-runtime-evidence == 'true'
    uses: ./.github/workflows/runtime-evidence.yml
    permissions:
      contents: read

  validate-foundation-audit:
    needs: verify
    if: github.event_name == 'pull_request' && needs.verify.outputs.validate-foundation-audit == 'true'
    uses: ./.github/workflows/foundation-audit.yml
    permissions:
      contents: read

  validate-assets:
    needs: verify
    if: github.event_name == 'pull_request' && needs.verify.outputs.validate-assets == 'true'
    uses: ./.github/workflows/assets.yml
    permissions:
      contents: read

  merge-ready:
    name: ${{ github.event_name == 'pull_request' && 'merge-ready' || 'validation-summary' }}
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs: ["verify", "validate-runtime-evidence", "validate-foundation-audit", "validate-assets"]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["verify", "validate-runtime-evidence", "validate-foundation-audit", "validate-assets"]'
          allow-skipped: ${{ needs.verify.outputs.allow-skipped || '[]' }}
