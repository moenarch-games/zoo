name: Foundation Fleet Audit

on:
  push:
    branches:
    - main
    paths:
    - .github/workflows/foundation-audit.yml
    - .repository-environment.toml
    - scripts/codex-environment.sh
    - .coding-tooling.json
    - conventions.json
    - conventions.lock.json
    - .conventions/**
    - renovate.json
    - AGENTS.md
    - .editorconfig
    - apps/web/package.json
    - apps/web/bun.lock
    - apps/web/tsconfig.json
    - apps/web/.oxlintrc.json
    - apps/web/.oxfmtrc.json
    - Makefile
  schedule:
  - cron: 59 3 * * *
  workflow_dispatch: null
  workflow_call: null

permissions:
  contents: read

jobs:
  foundation:
    permissions:
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@5e4c334179c59bbc4a4768bf033ff1d27cd89c0c # main
    with:
      operation: foundation
      install_mode: none
      allow_missing_foundation: true
      report_path: .artifacts/coding-tooling/foundation.json
      artifact_retention_days: 14
