name: Foundation Fleet Audit

on:
  pull_request:
    paths:
      - .github/workflows/foundation-audit.yml
      - .repository-environment.toml
      - scripts/codex-environment.sh
      - .coding-tooling.json
      - conventions.json
      - conventions.lock.json
      - .conventions/**
      - renovate.json
      - AGENTS.md
      - .editorconfig
      - apps/web/package.json
      - apps/web/bun.lock
      - apps/web/tsconfig.json
      - apps/web/.oxlintrc.json
      - apps/web/.oxfmtrc.json
      - Makefile
  push:
    branches: [main]
    paths:
      - .github/workflows/foundation-audit.yml
      - .repository-environment.toml
      - scripts/codex-environment.sh
      - .coding-tooling.json
      - conventions.json
      - conventions.lock.json
      - .conventions/**
      - renovate.json
      - AGENTS.md
      - .editorconfig
      - apps/web/package.json
      - apps/web/bun.lock
      - apps/web/tsconfig.json
      - apps/web/.oxlintrc.json
      - apps/web/.oxfmtrc.json
      - Makefile
  schedule:
    - cron: '59 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  foundation:
    permissions:
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@15e2a80f13e16d29e432ab761891b5d520622360 # main
    with:
      operation: foundation
      install_mode: none
      allow_missing_foundation: true
      report_path: .artifacts/coding-tooling/foundation.json
      artifact_retention_days: 14
