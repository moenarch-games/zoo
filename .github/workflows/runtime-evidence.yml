name: Runtime evidence and Moonlight

on:
  workflow_call: null

concurrency:
  group: zoo-runtime-evidence-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUNTIME_PROFILER_REV: 8280c95feb2a1075efa0480a9622e40c723e0b3a
  MOONLIGHT_REV: a615843b6497cfa0e746224673592c107d969bda

jobs:
  zoo-evidence:
    name: Zoo simulation runtime evidence and behavior
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0

      - name: Check out exact base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: reference
          fetch-depth: 0

      - name: Check out pinned Moonlight
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: moritzbrantner/moonlight
          ref: ${{ env.MOONLIGHT_REV }}
          path: moonlight

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-unknown-unknown
          rustup default stable

      - name: Install runtime-profiler
        run: cargo install --git https://github.com/moritzbrantner/runtime-profiler --rev "$RUNTIME_PROFILER_REV" --locked

      - name: Give the base the identical simulation workload
        run: |
          mkdir -p reference/crates/zoo-core/examples reference/profiles/runtime-profiler
          cp candidate/crates/zoo-core/examples/profile_simulation.rs \
            reference/crates/zoo-core/examples/profile_simulation.rs
          cp candidate/profiles/runtime-profiler/simulation.json reference/profiles/runtime-profiler/simulation.json
          # Keep the base's own lockfile when it has one: it matches the base manifests, while
          # the candidate's lockfile fails --locked whenever the candidate changes dependencies.
          if [ ! -f reference/Cargo.lock ]; then
            cp candidate/Cargo.lock reference/Cargo.lock
          fi
          git -C reference add \
            crates/zoo-core/examples/profile_simulation.rs \
            profiles/runtime-profiler/simulation.json \
            Cargo.lock
          if ! git -C reference diff --cached --quiet; then
            git -C reference \
              -c user.name='runtime-profiler' \
              -c user.email='runtime-profiler@invalid' \
              commit -m 'chore: attach comparable zoo simulation workload'
          fi

      - name: Prime deterministic workload
        run: |
          (cd reference && cargo build --locked --release -p zoo-core --example profile_simulation)
          (cd candidate && cargo build --locked --release -p zoo-core --example profile_simulation)
          test -z "$(git -C reference status --porcelain)"
          test -z "$(git -C candidate status --porcelain)"

      - name: Capture reference evidence
        working-directory: reference
        run: |
          runtime-profiler capture \
            --scenario profiles/runtime-profiler/simulation.json \
            --output "$RUNNER_TEMP/reference-zoo"
          runtime-profiler validate --bundle "$RUNNER_TEMP/reference-zoo"

      - name: Capture candidate evidence
        working-directory: candidate
        run: |
          runtime-profiler capture \
            --scenario profiles/runtime-profiler/simulation.json \
            --output "$RUNNER_TEMP/candidate-zoo"
          runtime-profiler validate --bundle "$RUNNER_TEMP/candidate-zoo"

      - name: Compare runtime evidence
        run: |
          set -euo pipefail
          runtime-profiler score \
            --reference "$RUNNER_TEMP/reference-zoo" \
            --candidate "$RUNNER_TEMP/candidate-zoo" \
            --json | tee "$RUNNER_TEMP/runtime-zoo.json"
          {
            echo '### runtime-profiler comparison'
            echo '```json'
            cat "$RUNNER_TEMP/runtime-zoo.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run Moonlight correctness evaluation
        working-directory: candidate
        run: |
          set -euo pipefail
          git fetch origin "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          cargo run --quiet \
            --manifest-path ../moonlight/Cargo.toml \
            -p moonlight-cli --bin moonlight -- \
            eval run \
            --project moonlight.eval.toml \
            --storage-path .moonlight/runtime-evidence.jsonl \
            --format markdown \
            --baseline-ref "${{ github.event.pull_request.base.sha }}" \
            --candidate-ref "${{ github.event.pull_request.head.sha }}" \
            | tee "$RUNNER_TEMP/moonlight.md"
          {
            echo '### Moonlight evaluation'
            cat "$RUNNER_TEMP/moonlight.md"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zoo-runtime-moonlight-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/reference-zoo
            ${{ runner.temp }}/candidate-zoo
            ${{ runner.temp }}/runtime-zoo.json
            ${{ runner.temp }}/moonlight.md
          if-no-files-found: warn
